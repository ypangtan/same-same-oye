        - 'Activity API'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                content_type:
                  type: integer
                  description: 'Required when type=stream. One of: 1, 2, 3, 4, 5, 6.'
                  example: 2
                radio_name:
                  type: string
                  description: nullable.
                  example: '"Hits FM"'
                item_id:
                  type: string
                  description: 'Required when content_type=2.'
                  example: '5'
                playlist_id:
                  type: string
                  description: 'Required when content_type=3.'
